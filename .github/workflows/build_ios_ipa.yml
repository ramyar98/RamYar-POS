name: Build iOS IPA

# Produces a downloadable .ipa on every push, without a paid Apple Developer
# account and without a Mac in the building.
#
# READ THIS FIRST - what "signed" can and cannot mean here:
#
#   iOS checks a signature against Apple's certificate chain. A SELF-SIGNED
#   certificate is therefore NOT installable on a normal (non-jailbroken)
#   iPhone, no matter how the .ipa is packaged - the device rejects it at
#   install time. There is no CI trick that changes that; it is enforced by
#   the OS.
#
#   So this workflow produces an UNSIGNED .ipa, which is a real, complete app
#   bundle that just has no code signature yet. Sideloadly / AltStore / iTunes
#   install it by re-signing on the spot with YOUR OWN free Apple ID, and that
#   re-signing is what makes it installable. That path needs no paid account
#   and no Mac. Its one limitation is the free-account 7-day expiry: re-run
#   Sideloadly weekly.
#
#   If you later want a .ipa that installs with no re-signing step at all, put
#   a real Apple distribution certificate + provisioning profile in the repo
#   secrets listed under "OPTIONAL SIGNED BUILD" below. The workflow detects
#   them automatically and switches to a signed build; nothing else changes.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Only one build per ref: a newer push cancels the older run.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.kalakchi.ramyar.pos
  IPA_NAME: RamyarPOS-unsigned

jobs:
  # Fails fast and cheaply if the Dart toolchain on the runner is older than
  # pubspec.yaml allows, with a message that says what to change, instead of
  # dying halfway through `flutter pub get` with a version-solving wall.
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Dart satisfies pubspec.yaml
        run: |
          set -euo pipefail
          need=$(awk '/^  sdk: \^/{gsub(/[^0-9.]/,"",$2); print $2; exit}' pubspec.yaml)
          have=$(dart --version 2>&1 | awk '{print $4}')
          echo "Dart required >= $need | installed $have"
          awk -v n="$need" -v h="$have" 'BEGIN{split(n,a,".");split(h,b,".");
            for(i=1;i<=3;i++){ if(b[i]+0>a[i]+0) exit 0; if(b[i]+0<a[i]+0) exit 1 } }' /dev/null \
          || { echo "ERROR: the pinned Flutter ships Dart $have, but this project needs >= $need.";
               echo "Fix: pin the flutter-action channel/version to a release whose Dart >= $need.";
               exit 1; }

  build-ios-ipa:
    needs: toolchain
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Get Flutter packages
        run: flutter pub get

      # This project uses no Podfile (its plugins resolve through Flutter's
      # built-in mechanism), so this is a guarded no-op that still does the
      # right thing if a Podfile is ever added.
      - name: Install CocoaPods dependencies (if any)
        run: |
          find . -name "Podfile" -maxdepth 3 -execdir pod install \;

      - name: Static analysis (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run unit tests (non-blocking on CI hardware)
        run: flutter test
        continue-on-error: true

      # ----------------------------------------------------------------------
      # OPTIONAL SIGNED BUILD
      #
      # If (and only if) these four secrets exist, a keychain is created and a
      # real export is done, so the artifact installs without re-signing:
      #   BUILD_CERTIFICATE_BASE64   base64 of a .p12 distribution certificate
      #   P12_PASSWORD               its password
      #   PROVISIONING_PROFILE_BASE64 base64 of a .mobileprovision
      #   KEYCHAIN_PASSWORD          any throwaway password for the temp keychain
      # Missing secrets are not an error - the build falls through to unsigned.
      # ----------------------------------------------------------------------
      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "${CERT:-}" ] && [ -n "${PROFILE:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found - will build a SIGNED .ipa."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets - building the UNSIGNED .ipa (Sideloadly path)."
          fi

      - name: Install signing certificate and provisioning profile
        if: steps.signing.outputs.have == 'true'
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$CERT" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build unsigned release app
        if: steps.signing.outputs.have != 'true'
        run: flutter build ios --release --no-codesign

      - name: Package the .app into a real .ipa
        if: steps.signing.outputs.have != 'true'
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          OUT_DIR="build/ios/unsigned-ipa"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/Payload"
          cp -R "$APP_PATH" "$OUT_DIR/Payload/"
          ( cd "$OUT_DIR" && zip -qry "$IPA_NAME.ipa" Payload && rm -rf Payload )
          ls -lh "$OUT_DIR/$IPA_NAME.ipa"
          echo "Bundle ID inside the ipa: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"

      # A signed build still starts from an unsigned `flutter build ios`, then
      # archives and exports with the installed profile - so the same code path
      # feeds both outcomes.
      - name: Build signed archive and export .ipa
        if: steps.signing.outputs.have == 'true'
        env:
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/signed-ipa"
          mkdir -p build/ios/ipa
          cp "$RUNNER_TEMP"/signed-ipa/*.ipa build/ios/ipa/

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/ios/unsigned-ipa/*.ipa dist/ 2>/dev/null || true
          cp build/ios/ipa/*.ipa dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30
