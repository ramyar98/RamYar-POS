# =============================================================================
#  GitHub Actions — iOS build for Ramyar POS
#  Project: ramyar_pos   Bundle ID: com.kalakchi.ramyar.pos   Flutter: 3.38.5
# -----------------------------------------------------------------------------
#  JOBS
#    1. unsigned-ipa   -> always runs. Produces RamyarPOS-unsigned.ipa
#                         (unsigned .ipa you can sideload with Sideloadly /
#                         AltStore using a FREE Apple ID). No secrets needed.
#    2. preflight      -> checks whether signing secrets exist.
#    3. signed-ipa     -> runs ONLY when the signing secrets below are set.
#                         Produces a signed .ipa for TestFlight / App Store.
#
#  COST NOTE
#    - Public repo  : macOS minutes are free.
#    - Private repo : macOS minutes cost 10x. The free plan = 2000 min/month,
#                     i.e. only ~200 macOS minutes. Prefer Codemagic for iOS.
#
#  SECRETS REQUIRED ONLY FOR THE SIGNED JOB (Settings > Secrets and variables >
#  Actions). Generate them on Windows with the PowerShell command shown:
#
#    BUILD_CERTIFICATE_BASE64     Apple Distribution .p12, base64:
#                                 [Convert]::ToBase64String([IO.File]::ReadAllBytes("dist.p12")) | Set-Clipboard
#    P12_PASSWORD                 password of that .p12
#    BUILD_PROVISION_PROFILE_BASE64  .mobileprovision, base64 (same command)
#    KEYCHAIN_PASSWORD            any random string you invent (temporary keychain)
#
#  REPOSITORY VARIABLES (Settings > Secrets and variables > Actions > Variables)
#    BUNDLE_ID                    com.kalakchi.ramyar.pos
# =============================================================================

name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run when a newer one starts on the same branch.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.5"
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.kalakchi.ramyar.pos' }}
  IPA_NAME: RamyarPOS

jobs:
  # ---------------------------------------------------------------------------
  # 1) UNSIGNED .IPA — works today, no Apple Developer account required
  # ---------------------------------------------------------------------------
  unsigned-ipa:
    name: Unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter packages
        run: flutter pub get

      - name: Install CocoaPods dependencies (no-op - Swift Package Manager)
        run: |
          # ios/ has no Podfile - plugins come from Swift Package Manager. The
          # step stays so a Podfile added later is still installed.
          find . -name "Podfile" -execdir pod install \;

      - name: Static analysis (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests (non-blocking)
        run: flutter test || true

      - name: Build unsigned release app
        run: flutter build ios --release --no-codesign

      - name: Package the .app into a real .ipa
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          OUT_DIR="build/ios/unsigned-ipa"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/Payload"
          cp -R "$APP_PATH" "$OUT_DIR/Payload/"
          cd "$OUT_DIR"
          zip -qry "$IPA_NAME-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "$IPA_NAME-unsigned.ipa"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-unsigned-ipa
          path: |
            build/ios/unsigned-ipa/*.ipa
            build/ios/archive/*.xcarchive
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2) PREFLIGHT — are the signing secrets configured?
  #    (Secrets cannot be used directly in a job-level `if:`, hence this step.)
  # ---------------------------------------------------------------------------
  preflight:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$P12" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found -> signed .ipa job WILL run."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing -> skipping signed .ipa job (this is normal)."
          fi

  # ---------------------------------------------------------------------------
  # 3) SIGNED .IPA — only when the signing secrets above are present
  # ---------------------------------------------------------------------------
  signed-ipa:
    name: Signed .ipa (TestFlight ready)
    needs: preflight
    if: needs.preflight.outputs.has_signing == 'true'
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Install CocoaPods dependencies (no-op - Swift Package Manager)
        run: |
          # ios/ has no Podfile - plugins come from Swift Package Manager. The
          # step stays so a Podfile added later is still installed.
          find . -name "Podfile" -execdir pod install \;

      - name: Install Codemagic CLI tools (keychain / xcode-project helpers)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install codemagic-cli-tools

      - name: Initialize temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: keychain initialize

      - name: Install Apple Distribution certificate
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          echo "$CERT_BASE64" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$P12_PASSWORD"
          rm -f /tmp/certificate.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_HOME/build.mobileprovision"
          ls -l "$PROFILES_HOME"

      - name: Apply provisioning profiles to the Xcode project
        run: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build signed .ipa
        run: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }} \
            --export-options-plist=$HOME/export_options.plist

      - name: Upload signed .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-signed-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive
            $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
          if-no-files-found: error
          retention-days: 14

      # --- Optional: upload straight to TestFlight -------------------------
      # Add these 3 secrets, then uncomment:
      #   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY (.p8 content)
      #
      # - name: Upload to TestFlight
      #   env:
      #     ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      #     KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      #     PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      #   run: |
      #     echo "$PRIVATE_KEY" > /tmp/AuthKey.p8
      #     xcrun altool --upload-app \
      #       --type ios \
      #       --file build/ios/ipa/*.ipa \
      #       --apiKey "$KEY_ID" \
      #       --apiIssuer "$ISSUER_ID" \
      #       --private-key-file /tmp/AuthKey.p8
