definitions:
  instance_mac:
    instance_type: mac_mini_m2
    max_build_duration: 120
  tool_versions:
    flutter: 3.47.7
    xcode: latest
    cocoapods: default
  script_versions: &id002
    name: Print toolchain versions
    script: "flutter --version\ndart --version\nxcodebuild -version\npod --version\n\
      \n# Fail here, with a readable message, when the machine's Dart is older than\n\
      # pubspec.yaml allows - instead of dying later inside `flutter pub get`\n# with\
      \ \"Because ramyar_pos requires SDK version ^3.12.1 ... version\n# solving failed\"\
      .\nneed=$(awk '/^  sdk: \\^/{gsub(/[^0-9.]/,\"\",$2); print $2; exit}' pubspec.yaml)\n\
      have=$(dart --version 2>&1 | awk '{print $4}')\necho \"Dart required >= $need\
      \ | installed $have\"\nawk -v n=\"$need\" -v h=\"$have\" 'BEGIN{split(n,a,\"\
      .\");split(h,b,\".\");\n  for(i=1;i<=3;i++){ if(b[i]+0>a[i]+0) exit 0; if(b[i]+0<a[i]+0)\
      \ exit 1 } }' /dev/null \\\n  || { echo \"ERROR: the pinned Flutter ships Dart\
      \ $have, but this project needs >= $need.\"; \\\n       echo \"Fix: set environment.flutter\
      \ in codemagic.yaml to a stable release whose Dart >= $need.\"; \\\n       exit\
      \ 1; }\n"
  script_pub_get: &id003
    name: Get Flutter packages
    script: 'flutter pub get

      '
  script_pods: &id004
    name: Install CocoaPods dependencies
    script: '# No-op today: this project resolves its plugins with Swift Package

      # Manager (ios/ has no Podfile). Kept so a Podfile added later still runs.

      find . -name "Podfile" -execdir pod install \;

      '
  script_analyze: &id005
    name: Static analysis (non-blocking)
    script: 'flutter analyze --no-fatal-infos --no-fatal-warnings || true

      '
  script_use_profiles: &id007
    name: Set up code signing settings on the Xcode project
    script: '# Writes matching ExportOptions.plist to $HOME/export_options.plist

      xcode-project use-profiles --project ios/Runner.xcodeproj

      '
  cache_paths: &id001
    cache_paths:
    - $HOME/.pub-cache
    - $HOME/Library/Caches/CocoaPods
  artifacts_ipa: &id006
  - build/ios/ipa/*.ipa
  - build/ios/unsigned-ipa/*.ipa
  - build/ios/archive/*.xcarchive
  - /tmp/xcodebuild_logs/*.log
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
workflows:
  ios-ipa-unsigned:
    instance_type: mac_mini_m2
    max_build_duration: 120
    name: iOS Unsigned .ipa (no Apple account needed)
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.kalakchi.ramyar.pos
        IPA_NAME: RamyarPOS-unsigned
    triggering:
      events:
      - push
      - pull_request
      branch_patterns:
      - pattern: '*'
        include: true
        source: true
      cancel_previous_builds: true
    cache: *id001
    scripts:
    - *id002
    - *id003
    - *id004
    - *id005
    - name: Run unit tests
      script: 'flutter test

        '
      ignore_failure: true
    - name: Build unsigned release app
      script: 'flutter build ios --release --no-codesign

        '
    - name: Package the .app into a real .ipa
      script: 'set -e

        APP_PATH="build/ios/iphoneos/Runner.app"

        OUT_DIR="build/ios/unsigned-ipa"

        rm -rf "$OUT_DIR"

        mkdir -p "$OUT_DIR/Payload"

        cp -R "$APP_PATH" "$OUT_DIR/Payload/"

        cd "$OUT_DIR"

        zip -qry "$IPA_NAME.ipa" Payload

        rm -rf Payload

        ls -lh "$IPA_NAME.ipa"

        echo "Bundle ID inside the ipa: $(/usr/libexec/PlistBuddy -c ''Print :CFBundleIdentifier''
        "$APP_PATH/Info.plist")"

        '
    artifacts: *id006
  ios-release:
    instance_type: mac_mini_m2
    max_build_duration: 120
    name: iOS Release (signed .ipa)
    integrations:
      app_store_connect: ramyar_pos_key
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kalakchi.ramyar.pos
      vars:
        BUNDLE_ID: com.kalakchi.ramyar.pos
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    # Signed builds are started manually from the Codemagic dashboard only:
    # they need the App Store Connect API key (ramyar_pos_key) and signing
    # certificates configured, and must not run on every push. No events
    # below means the workflow can only be started manually.
    triggering: {}
    cache: *id001
    scripts:
    - *id002
    - *id003
    - *id004
    - *id007
    - *id005
    - name: Run unit tests
      script: 'flutter test

        '
      ignore_failure: true
    - name: Build signed .ipa
      script: "flutter build ipa --release \\\n  --build-name=1.0.0 \\\n  --build-number=$PROJECT_BUILD_NUMBER\
        \ \\\n  --export-options-plist=$HOME/export_options.plist\n# Auto-increment\
        \ alternative (needs APP_STORE_ID above):\n# --build-number=$(($(app-store-connect\
        \ get-latest-testflight-build-number \"$APP_STORE_ID\") + 1))\n"
    - name: Inspect the built .ipa
      script: 'ls -lh build/ios/ipa/ || true

        unzip -l build/ios/ipa/*.ipa | head -40 || true

        '
    artifacts: *id006
    publishing: {}
  ios-release-fallback:
    instance_type: mac_mini_m2
    max_build_duration: 120
    name: 'iOS Release (fallback: auto-create signing files)'
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      groups:
      - appstore_credentials
      vars:
        BUNDLE_ID: com.kalakchi.ramyar.pos
    scripts:
    - name: Initialize keychain
      script: 'keychain initialize

        '
    - name: Fetch (create if missing) certificate + App Store profile
      script: "app-store-connect fetch-signing-files \"$BUNDLE_ID\" \\\n  --platform\
        \ IOS \\\n  --type IOS_APP_STORE \\\n  --certificate-key=@env:CERTIFICATE_PRIVATE_KEY\
        \ \\\n  --create\n"
    - name: Add certificates to keychain
      script: 'keychain add-certificates

        '
    - *id007
    - *id002
    - *id003
    - *id004
    - name: Build signed .ipa
      script: "flutter build ipa --release \\\n  --build-number=$PROJECT_BUILD_NUMBER\
        \ \\\n  --export-options-plist=$HOME/export_options.plist\n"
    artifacts: *id006
